# EmotionHub 后端配置文件 - 生产环境
spring:
  application:
    name: emotion-hub
  flyway:
    enabled: true
    baseline-on-migrate: true

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/emotion_hub?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:emotionhub}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: 30
      maximum-pool-size: 150
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 150
          max-idle: 75
          min-idle: 20
          max-wait: 1000ms

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000
  header: Authorization
  prefix: Bearer

# LLM配置
llm:
  openai:
    enabled: ${LLM_OPENAI_ENABLED:false}
    api-key: ${LLM_OPENAI_KEY}
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-3.5-turbo
    timeout: 30000

  qianwen:
    enabled: ${LLM_QIANWEN_ENABLED:true}
    api-key: ${LLM_QIANWEN_KEY}
    api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    model: qwen-turbo
    timeout: 30000

  scheduler:
    strategy: round-robin
    enable-fallback: true
    max-retries: 2
    cache-enabled: true
    cache-ttl: 86400
    rate-limit: 100

# 通义千问API配置（与QwenEmotionAnalysisServiceImpl一致）
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}

# 情感分析配置
emotion:
  analysis:
    provider: ${EMOTION_PROVIDER:qwen}  # keyword/qwen

# 异步线程池配置
async:
  executor:
    core-pool-size: 20
    max-pool-size: 100
    queue-capacity: 500
    thread-name-prefix: emotion-async-
    keep-alive-seconds: 60

# 定时任务配置
schedule:
  emotion-stats:
    cron: 0 0 1 * * ?

# 日志配置
logging:
  level:
    root: INFO
    com.emotionhub: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: /var/log/emotion-hub/emotion-hub.log
    max-size: 50MB
    max-history: 30

# 文件存储配置
emotionhub:
  file:
    # 生产环境默认使用阿里云OSS（local/cos备选）
    mode: ${FILE_STORAGE_MODE:oss}
    local:
      base-path: ${FILE_LOCAL_BASE_PATH:/var/emotionhub/uploads}
      access-url: ${FILE_LOCAL_ACCESS_URL:http://localhost:8080/uploads}
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      bucket: ${COS_BUCKET:}
      region: ${COS_REGION:ap-guangzhou}
      domain: ${COS_DOMAIN:}
      prefix: images/
    oss:
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket: ${OSS_BUCKET:}
      region: ${OSS_REGION:cn-hangzhou}
      domain: ${OSS_DOMAIN:}
      prefix: images/

# Resilience4j 限流熔断配置
resilience4j:
  ratelimiter:
    instances:
      global:
        limit-for-period: 600
        limit-refresh-period: 1s
        timeout-duration: 2s
      post:
        limit-for-period: 150
        limit-refresh-period: 1s
        timeout-duration: 1s
      feed:
        limit-for-period: 300
        limit-refresh-period: 1s
        timeout-duration: 2s
      emotion:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 3s
  circuitbreaker:
    instances:
      emotion:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 20s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s

# 服务器配置
server:
  port: 8080
  tomcat:
    max-http-post-size: 50MB
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 10000
  servlet:
    context-path:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Actuator监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    circuitbreakers:
      enabled: true

# Swagger/Knife4j配置
knife4j:
  enable: false  # 生产环境关闭API文档
